<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iNote - Take your note</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
            header.bg-light {
              background: #e0e0e0;
              color: #222;
              border-bottom: 2px solid #bdbdbd;
            }
            header.bg-light h1 {
              color: #222;
            }
      body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #f8f9fa;
      }
      h1, h2 {
        font-weight: 600;
      }
      h1 {
        font-size: 2.2rem;
      }
      h2 {
        font-size: 1.5rem;
        margin-top: 2rem;
      }
      .form-label {
        font-size: 1rem;
      }
      .form-control, textarea {
        font-size: 1rem;
      }
      .btn-primary {
        font-size: 1rem;
        padding: 0.5rem 1.2rem;
      }
      .notes-list {
        list-style: none;
        padding-left: 0;
      }
      .note-item {
        margin-bottom: 1.2rem;
      }
      .note-content {
        font-size: 1.05rem;
        display: flex;
        align-items: center;
        gap: 0.7rem;
      }
      .badge {
        font-size: 0.95em;
        padding: 0.35em 0.7em;
      }
      .btn-danger {
        font-size: 0.95em;
        padding: 0.35em 0.7em;
        height: auto;
        line-height: 1.2;
      }
    </style>
  </head>

  <script>
    function deleteNote(noteId) {
        fetch(`/${noteId}`, {
            method: "DELETE"
        })
        .then(res => {
            if (res.ok) {
                location.reload(); // refresh notes list
            } else {
                alert("Failed to delete note");
            }
        })
        .catch(err => console.error(err));
    }

    function enableInlineEdit(noteId) {
        const noteItem = document.querySelector(`#editTitle-${noteId}`).closest('.note-item');
        const displayDiv = noteItem.querySelector('.note-display');
        const editDiv = noteItem.querySelector('.note-edit');

        displayDiv.classList.add('d-none');
        editDiv.classList.remove('d-none');
    }

    function cancelInlineEdit(noteId) {
        const noteItem = document.querySelector(`#editTitle-${noteId}`).closest('.note-item');
        const displayDiv = noteItem.querySelector('.note-display');
        const editDiv = noteItem.querySelector('.note-edit');

        displayDiv.classList.remove('d-none');
        editDiv.classList.add('d-none');
    }

    function submitInlineEdit(event, noteId) {
        event.preventDefault();

        const title = document.getElementById(`editTitle-${noteId}`).value;
        const desc = document.getElementById(`editDesc-${noteId}`).value;
        const important = document.getElementById(`editImportant-${noteId}`).checked;

        fetch(`/${noteId}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                title: title,
                desc: desc,
                important: important
            })
        })
        .then(res => {
            if (res.ok) {
                location.reload();
            } else {
                alert("Failed to update note");
            }
        })
        .catch(err => console.error(err));
    }
  </script>

  <body>

    <!-- Medium size header with centered iNote and search bar, reduced height -->
    <header class="py-2 mb-4 bg-light">
      <div class="container d-flex flex-column flex-md-row align-items-center justify-content-between">
        <h1 class="display-6 mb-2 mb-md-0 w-100"><strong>iNote</strong></h1>
        <form class="d-flex w-100 justify-content-center" role="search" style="max-width: 400px;">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
      </div>
    </header>

    <div class="container">
      <h1 class="mt-4 mb-3 text-center">Start adding your notes</h1>
      <form method="post" class="mb-4">
        <div class="mb-3">
          <label for="title" class="form-label">Note Name</label>
          <input type="text" class="form-control" id="title" name="title" placeholder="">
        </div>
        <div class="mb-3">
          <label for="desc" class="form-label">Enter the Note</label>
          <textarea class="form-control" id="desc" name="desc" rows="3"></textarea>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="important" name="important">
          <label class="form-check-label" for="important">Important</label>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </div>
    <div class="container">
      <h2 class="mb-3 mt-4 text-center">Your Notes</h2>
      <ul class="notes-list">
        {% if newDocs is defined and newDocs|length == 0 %}
          <li class="note-item text-center">No Notes to Display</li>
        {% else %}
          {% for item in newDocs %}
            <li class="note-item">
              <div class="note-content">
                <div class="note-display">
                  <strong>{{ item.title }}</strong>: {{ item.desc }}
                  {% if item.important %}
                    <span class="badge bg-warning text-dark">Important</span>
                  {% endif %}
                  <button class="btn btn-secondary me-2" onclick="enableInlineEdit('{{item.id}}')">Edit</button>
                  <button class="btn btn-danger" onclick="deleteNote('{{item.id}}')">Delete</button>
                </div>
                <div class="note-edit d-none">
                  <form class="d-flex align-items-center" onsubmit="submitInlineEdit(event, '{{item.id}}')">
                    <input type="text" class="form-control me-2" id="editTitle-{{item.id}}" value="{{ item.title }}" required>
                    <input type="text" class="form-control me-2" id="editDesc-{{item.id}}" value="{{ item.desc }}" required>
                    <div class="form-check me-2">
                      <input type="checkbox" class="form-check-input" id="editImportant-{{item.id}}" {% if item.important %}checked{% endif %}>
                      <label class="form-check-label" for="editImportant-{{item.id}}">Important</label>
                    </div>
                    <button type="submit" class="btn btn-primary me-2">Save</button>
                    <button type="button" class="btn btn-secondary" onclick="cancelInlineEdit('{{item.id}}')">Cancel</button>
                  </form>
                </div>
              </div>
            </li>
          {% endfor %}
        {% endif %}
      </ul>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
      function enableInlineEdit(noteId) {
        const noteItem = document.querySelector(`#editTitle-${noteId}`).closest('.note-item');
        const displayDiv = noteItem.querySelector('.note-display');
        const editDiv = noteItem.querySelector('.note-edit');

        displayDiv.classList.add('d-none');
        editDiv.classList.remove('d-none');
      }

      function cancelInlineEdit(noteId) {
        const noteItem = document.querySelector(`#editTitle-${noteId}`).closest('.note-item');
        const displayDiv = noteItem.querySelector('.note-display');
        const editDiv = noteItem.querySelector('.note-edit');

        displayDiv.classList.remove('d-none');
        editDiv.classList.add('d-none');
      }

      function submitInlineEdit(event, noteId) {
        event.preventDefault();

        const title = document.getElementById(`editTitle-${noteId}`).value;
        const desc = document.getElementById(`editDesc-${noteId}`).value;
        const important = document.getElementById(`editImportant-${noteId}`).checked;

        fetch(`/${noteId}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            title: title,
            desc: desc,
            important: important
          })
        })
        .then(res => {
          if (res.ok) {
            location.reload();
          } else {
            alert("Failed to update note");
          }
        })
        .catch(err => console.error(err));
      }
    </script>
  </body>
</html>
